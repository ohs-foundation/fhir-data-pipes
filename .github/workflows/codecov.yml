# This is based on:
# https://github.com/codecov/example-java-maven/blob/main/.github/workflows/ci.yml
name: Codecov
on: [push, pull_request]
jobs:
  run:
    # [TẮT TRÊN FORK] Job này chạy `mvn install` + `mvn test` toàn project ở MỌI
    # push và MỌI pull_request — nặng nhất trong repo. Fork LACVIET-YTE không có
    # secret CODECOV_TOKEN và cũng không dùng dashboard Codecov, nên bước upload
    # luôn fail → mỗi lần push đều có 1 workflow đỏ vô nghĩa.
    # Điều kiện dưới giữ nguyên hành vi khi đóng góp ngược lên upstream.
    if: github.repository == 'ohs-foundation/fhir-data-pipes'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v1
      with:
        java-version: 17
    - name: Install dependencies
      run: mvn install -DskipTests=true -Dmaven.javadoc.skip=true -B -V
    - name: Run tests and collect coverage
      run: mvn -B test
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      env:
        # To find this token, and how it is stored in the repo, see:
        # https://docs.codecov.com/docs/adding-the-codecov-token
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}