  # [ĐÃ BỎ] terminology-loader (script curl+psql nạp Dim_ICD10/Dim_LOINC vào Postgres) -
  # không cần nữa. Đã chuyển hẳn sang cơ chế pipeline-native: "CodeSystem" được thêm vào
  # resourceList (application.yaml) như 1 resource FHIR bình thường, pipeline tự crawl lại
  # mỗi lần chạy; CodeSystem_icd10_view.sql / CodeSystem_loinc_view.sql (trong config/views)
  # đọc thẳng bảng CodeSystem qua Spark SQL, không script/service riêng nào cả. Xem
  # ICD10_codesystem_view / LOINC_codesystem_view, join vào từ Condition_dim.sql /
  # Observation_fact.sql.

volumes:
  spark_vol_single:
  fhir_views_db_data:

networks:
  cloudbuild:
    external: true
    name: cloudbuild # Needed for Continuous integration
